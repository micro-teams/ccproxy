name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Builds the backend, the test frontend, and lints the scripts + the proxy-engine, packages a
# deployment bundle, then proves the bundle boots by bringing the docker-compose cluster up and
# waiting for every service to be healthy.

jobs:
  build-jar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: backend/pom.xml
          settings-path: ${{ github.workspace }}/backend
      - name: Start dependencies (Postgres)
        run: ./scripts/dependency-start.sh
      - name: Build with Maven (runs the integration tests)
        run: ./mvnw install
        env:
          SPRING_APPLICATION_JSON: '{"spring.jpa.hibernate.ddl-auto":"update"}'
      - name: Check uncommitted changes to ensure format applied
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git status
            echo "There are uncommitted changes. Please run './mvnw spotless:apply' and commit them."
            exit 1
          else
            echo "No uncommitted changes."
          fi
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: jar
          path: backend/target/*.jar
      # CREATE.sql is generated at build time (not versioned); ship it to package-zip via an artifact.
      - name: Upload CREATE.sql
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: create-sql
          path: backend/CREATE.sql

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: frontend-dist
          path: frontend/dist

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck the shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh deploy/*.sh backend/scripts/*.sh .github/scripts/*.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Syntax + lint the proxy-engine (stdlib-only Python)
        run: |
          python -m py_compile proxy-engine/*.py
          pip install pyflakes >/dev/null && python -m pyflakes proxy-engine/*.py

  # The refresh-absorption contract (#67), proven live: boots the real engine against a mock
  # Anthropic and drives a client through login capture, absorbed refreshes (stable fake pair),
  # a 5-holder single-flight real rotation, and the honest invalid_grant passthrough. Stdlib +
  # openssl only — no docker, no account, no network.
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh absorption test (live engine, mock Anthropic)
        run: python proxy-engine/test_refresh_absorption.py
      - name: Streaming large-body test (live engine, mock Anthropic)
        run: python proxy-engine/test_streaming.py
      - name: Upstream connect-retry test (live engine, flaky mock Anthropic)
        run: python proxy-engine/test_upstream_retry.py
      - name: Streaming usage-metering test (live engine, mock Anthropic + backend)
        run: python proxy-engine/test_metering.py

  # The machine-side connector: a thin brand shell over the shared micro-connector library. It is a
  # shipped build artifact — the control plane serves these binaries to real machines — so CI vets
  # it, cross-compiles the published targets, and uploads them for the bundle. The Go version comes
  # from go.mod (in lockstep with the shared library).
  connector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: Vet + test
        run: |
          go vet ./...
          go test ./...
      - name: Build binaries (one per OS/arch)
        run: |
          set -euo pipefail
          mkdir -p dist
          # Product version from the repo-root VERSION file, with the short commit as build metadata
          # for traceability — e.g. 0.2.1+1a2b3c4. cwd is connector/, so VERSION is one level up.
          VERSION="$(cat ../VERSION)+${GITHUB_SHA::7}"
          # Unix only: the connector drives a pty + tmux, so a machine that runs it is Linux or macOS.
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            echo "building ccproxy-connector-$os-$arch"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/ccproxy-connector-$os-$arch" .
          done
          ls -la dist
      - name: Upload connector binaries
        uses: actions/upload-artifact@v7
        with:
          name: cli-binaries
          path: connector/dist

  # A fully static tmux per Linux target, so a fresh machine needs nothing pre-installed: install.sh
  # drops it at ~/.config/ccproxy-connector/bin/tmux. Only the build recipe is in git. Built natively
  # per arch and cached by the recipe's hash, so an unchanged tmux version rebuilds instantly.
  build-tmux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache the built static tmux
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: dist/linux-${{ matrix.arch }}/tmux
          key: tmux-${{ matrix.arch }}-${{ hashFiles('deploy/tmux/Dockerfile', 'deploy/tmux/build-static-tmux.sh') }}
      - name: Set up Docker Buildx
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build static tmux (native, no QEMU)
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          deploy/tmux/build-static-tmux.sh --arch "${{ matrix.arch }}" --out dist
          ls -la dist/*/
      - name: Upload tmux binary
        uses: actions/upload-artifact@v7
        with:
          name: tmux-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}

  # The screen-driver applet (claude.js) the backend sends a connector to drive the login screen. It
  # is the shared micro-connector artifact — built from that repo, not vendored here — so a Claude
  # TUI fix reaches all three products from one place. Built from source, but pinned to the released
  # applets tag (applets-v<version>) so it moves only on a deliberate bump — in lockstep with the
  # cli version in connector/go.mod. (A later step could install the published
  # @micro-teams/connector-applets package instead; pinning the source clone locks the version today.)
  build-applet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build claude.js from the shared micro-connector
        run: |
          set -euo pipefail
          # Pinned to the released applets tag — keep in step with connector/go.mod's cli version.
          git clone --depth 1 --branch applets-v0.1.5 https://github.com/micro-teams/micro-connector.git mc
          cd mc/applets
          npm install
          node build.mjs
          test -s dist/claude.js
          mkdir -p "$GITHUB_WORKSPACE/applet-dist"
          cp dist/claude.js "$GITHUB_WORKSPACE/applet-dist/claude.js"
          ls -la "$GITHUB_WORKSPACE/applet-dist"
      - uses: actions/upload-artifact@v7
        with:
          name: applets
          path: applet-dist

  package-zip:
    needs: [build-jar, build-frontend, lint, connector, build-tmux, build-applet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble the deployment bundle
        run: |
          set -euo pipefail
          STAGE=ccproxy-deploy
          mkdir -p "$STAGE/backend" "$STAGE/frontend"
          cp deploy/docker-compose.yml deploy/nginx.conf deploy/gen-env.sh deploy/README.md "$STAGE/"
          cp artifacts/create-sql/CREATE.sql "$STAGE/CREATE.sql"
          cp -r deploy/init "$STAGE/"
          # Runtime files only — the engine's tests and bytecode caches must not ship in the bundle.
          cp -r proxy-engine "$STAGE/proxy-engine"
          rm -rf "$STAGE/proxy-engine/__pycache__" "$STAGE"/proxy-engine/test_*.py
          cp artifacts/jar/*.jar "$STAGE/backend/backend.jar"
          cp -r artifacts/frontend-dist/. "$STAGE/frontend/dist/"
          chmod +x "$STAGE/gen-env.sh"
          # The connector distribution the backend serves: the cross-compiled ccproxy-connector
          # binaries and the static tmux, laid out as connector/<target>/{ccproxy-connector,tmux}
          # (Go-style os-arch, matching install.sh's target and the self-updater's platform dir). It
          # is a shipped build artifact, so it lives at the bundle top level as connector/ — NOT under
          # app_data/, which gen-env.sh creates fresh at deploy time and holds only state you back up.
          # compose bind-mounts connector/ to the backend's application.connector-binaries-dir
          # (/app/connector), a replaceable independent part of the deployment.
          CONN="$STAGE/connector"
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os="${t%-*}"; arch="${t#*-}"
            mkdir -p "$CONN/$t"
            cp "artifacts/cli-binaries/ccproxy-connector-$os-$arch" "$CONN/$t/ccproxy-connector"
            chmod +x "$CONN/$t/ccproxy-connector"
          done
          # Static tmux is Linux-only; macOS uses its own via install.sh's system-tmux fallback.
          for arch in amd64 arm64; do
            if [ -f "artifacts/tmux-linux-$arch/tmux" ]; then
              cp "artifacts/tmux-linux-$arch/tmux" "$CONN/linux-$arch/tmux"
              chmod +x "$CONN/linux-$arch/tmux"
            fi
          done
          # The screen-driver applet the backend serves to a connector: a shipped artifact, mounted
          # to the backend's application.applets-dir (/app/applets).
          mkdir -p "$STAGE/applets"
          cp artifacts/applets/claude.js "$STAGE/applets/claude.js"
          echo "== bundle contents =="; find "$STAGE" -maxdepth 3 -type f | sort
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: ccproxy-deploy
          path: ccproxy-deploy

  test-compose:
    needs: [package-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ccproxy-deploy
          path: ccproxy-deploy
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bring the cluster up and wait for every service to be healthy
        working-directory: ccproxy-deploy
        run: |
          bash gen-env.sh
          docker compose up -d --wait --wait-timeout 360
      - name: Connector distribution is served through the gateway
        working-directory: ccproxy-deploy
        run: |
          set -eu
          PORT="$(grep -E '^NGINX_HTTP_PORT=' .env | cut -d= -f2 || true)"; PORT="${PORT:-80}"
          BASE="http://localhost:$PORT/ccproxy"
          echo "== install.sh (origin baked from the request) =="
          curl -fsS "$BASE/install.sh" -o /tmp/install.sh
          grep -q "connector/latest" /tmp/install.sh
          # Placeholders were replaced with this request's origin + the /ccproxy prefix. curl drops a
          # default :80 from the Host header, so match the host port-agnostically.
          ! grep -q "__CONNECTOR_BASE__" /tmp/install.sh
          grep -qE 'CCPROXY_CONNECTOR_BASE:-https?://localhost(:[0-9]+)?/ccproxy' /tmp/install.sh
          echo "== a published binary downloads and is an ELF =="
          curl -fsS "$BASE/connector/latest/linux-amd64/ccproxy-connector" -o /tmp/ccproxy-connector
          test -s /tmp/ccproxy-connector
          magic="$(head -c4 /tmp/ccproxy-connector | od -An -tx1 | tr -d ' \n')"
          case "$magic" in 7f454c46*) ;; *) echo "not an ELF (magic=$magic)"; exit 1 ;; esac
          echo "== unknown target / off-allowlist artifact is a 404 =="
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/connector/latest/linux-amd64/passwd")" = 404 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/connector/latest/win-x86/ccproxy-connector")" = 404 ]
          echo "connector distribution OK"
          echo "== the claude.js driver applet is mounted for the backend =="
          docker compose exec -T backend sh -c 'test -s /app/applets/claude.js && grep -q screenReady /app/applets/claude.js'
          echo "applet OK"
      - name: Cluster status
        if: always()
        working-directory: ccproxy-deploy
        run: docker compose ps
      - name: Dump logs on failure
        if: failure()
        working-directory: ccproxy-deploy
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        working-directory: ccproxy-deploy
        run: docker compose down

  # Boots the bundle, then spins a plain Debian container as a "machine", installs a given Claude Code
  # version, and drives provisioning + login all the way to AWAITING_CODE (an OAuth URL is scraped) —
  # no real account needed. `installer` uses the standard `install.sh` (the latest release) so we keep
  # confirming we stay compatible with the newest Claude Code; the pinned npm versions guard specific
  # releases — `npm:2.1.251` pins the CURRENT Claude Code, whose new folder-trust / login TUI drove the
  # micro-connector applets-v0.1.5 fix, so this leg is the dedicated regression guard for that version
  # (a floating `installer` alone would silently drift off it). Each leg exercises the fresh-wizard path
  # and the already-onboarded `/login` path.
  machine-login-compat:
    needs: [package-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        claude: ["installer", "npm:2.1.222", "npm:2.1.233", "npm:2.1.251"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ccproxy-deploy
          path: ccproxy-deploy
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bring the cluster up
        working-directory: ccproxy-deploy
        run: |
          bash gen-env.sh
          docker compose up -d --wait --wait-timeout 360
      - name: "Machine login compatibility: ${{ matrix.claude }}"
        working-directory: ccproxy-deploy
        run: bash "$GITHUB_WORKSPACE/.github/scripts/machine-login-smoke.sh" "${{ matrix.claude }}"
      - name: Dump logs on failure
        if: failure()
        working-directory: ccproxy-deploy
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        working-directory: ccproxy-deploy
        run: docker compose down

  # A machine ccproxy cannot SSH into installs the connector from the served install.sh, dials OUT to
  # the control plane, and is recognised online — the whole enrolment + WebSocket transport + hub
  # stack, live, on a real machine container. No Claude / no account needed.
  machine-connector-dialin:
    needs: [package-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ccproxy-deploy
          path: ccproxy-deploy
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bring the cluster up
        working-directory: ccproxy-deploy
        run: |
          bash gen-env.sh
          docker compose up -d --wait --wait-timeout 360
      - name: Connector dial-in
        working-directory: ccproxy-deploy
        run: bash "$GITHUB_WORKSPACE/.github/scripts/connector-dialin-smoke.sh"
      - name: Dump logs on failure
        if: failure()
        working-directory: ccproxy-deploy
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        working-directory: ccproxy-deploy
        run: docker compose down

  # DELETE /machine/{id} must be a RELIABLE revocation: engine session dropped and confirmed,
  # durable credential gone, restart-proof, and an honest 502 (nothing deleted) when the engine
  # cannot confirm. Exercised live against the compose cluster; no real account needed.
  machine-revoke:
    needs: [package-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ccproxy-deploy
          path: ccproxy-deploy
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bring the cluster up
        working-directory: ccproxy-deploy
        run: |
          bash gen-env.sh
          docker compose up -d --wait --wait-timeout 360
      - name: Machine revocation
        working-directory: ccproxy-deploy
        run: bash "$GITHUB_WORKSPACE/.github/scripts/machine-revoke-smoke.sh"
      - name: Dump logs on failure
        if: failure()
        working-directory: ccproxy-deploy
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        working-directory: ccproxy-deploy
        run: docker compose down

  # Single aggregate gate: succeeds only if every job above succeeded (a job with `needs` runs only
  # when all needed jobs pass; otherwise this is skipped and stays non-green). Require just this check
  # in branch protection / auto-merge rules instead of listing each job.
  ci-success:
    name: CI success
    needs: [build-jar, build-frontend, lint, engine-test, connector, build-tmux, build-applet, package-zip, test-compose, machine-login-compat, machine-connector-dialin, machine-revoke]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required CI jobs passed."
