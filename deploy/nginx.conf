# The single, domain-independent gateway. Same-origin: the SPA and the backend (/ccproxy) are
# served from whatever host an outer reverse-proxy maps in. That outer proxy terminates TLS and sets
# X-Forwarded-Proto/Host; this nginx forwards them so the backend can derive absolute URLs without
# knowing its own domain.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ''      $host;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64m;

    # The CCProxy backend at /ccproxy — strip the prefix (it mounts routes at the root). One
    # block covers HTTP and any future WebSocket under it.
    location /ccproxy/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The test SPA. Static, domain-independent (relative /ccproxy paths); any unknown route falls
    # back to index.html for client-side routing.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
